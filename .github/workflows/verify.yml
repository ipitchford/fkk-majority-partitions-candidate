name: Exact candidate verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: |
          python -m pip install sympy==1.14.0
          sudo apt-get update -qq
          sudo apt-get install -y nauty
      - name: Ordinary and optimized semantic checks
        run: |
          GENG=$(command -v geng || command -v nauty-geng)
          python verification/self_test.py
          python -O verification/self_test.py
          python verification/review_checks.py
          python -O verification/review_checks.py
          python verification/weighted/verify_certificates.py
          python -O verification/weighted/verify_certificates.py
          python verification/weighted/check_family.py
          python -O verification/weighted/check_family.py
          python verification/weighted/check_parity.py "$GENG"
          python -O verification/weighted/check_parity.py "$GENG"
      - name: Complete finite replay
        run: |
          GENG=$(command -v geng || command -v nauty-geng)
          python verification/exact_small_graphs.py --geng "$GENG" --max-n 9
          python -O verification/exact_small_graphs.py --geng "$GENG" --max-n 9
          python verification/audit_recorded_candidates.py
          python -O verification/audit_recorded_candidates.py
